<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivo Vault — Movies</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0d1117; color: #e6e6e6; }

  nav {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 5%; background: #161b22; position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); flex-wrap: wrap;
  }
  .logo { font-size: 1.5rem; font-weight: bold; color: #e50914; }
  .logo span { color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #search {
    padding: 10px 16px; border-radius: 25px; border: 1px solid #30363d;
    background: #0d1117; color: #fff; width: 220px; outline: none;
  }
  #search:focus { border-color: #e50914; }
  .nav-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; }
  #signInBtn { background: #fff; color: #000; }
  #logoutBtn { background: #30363d; color: #fff; }
  #uploadBtn { background: #e50914; color: #fff; }
  #editSiteBtn { background: #1f6feb; color: #fff; }
  #userEmail { color: #888; font-size: .85rem; }

  .hero {
    min-height: 55vh; display: flex; align-items: flex-end;
    background: linear-gradient(rgba(13,17,23,.3), rgba(13,17,23,.95)), var(--hero-bg, #161b22) center/cover;
    padding: 60px 5%;
  }
  .hero h1 { font-size: 3rem; margin-bottom: 12px; }
  .hero p { max-width: 600px; color: #ccc; margin-bottom: 20px; }
  .btn { display: inline-block; padding: 12px 28px; border: none; border-radius: 6px;
    background: #e50914; color: #fff; font-size: 1rem; cursor: pointer; text-decoration: none; }

  .filters { display: none; gap: 10px; flex-wrap: wrap; padding: 30px 5% 10px; }
  .filters.show { display: flex; }
  .filters button { padding: 8px 18px; border-radius: 20px; border: 1px solid #30363d;
    background: transparent; color: #ccc; cursor: pointer; }
  .filters button.active, .filters button:hover { background: #e50914; border-color: #e50914; color: #fff; }

  .grid { display: grid; gap: 24px; padding: 20px 5% 60px;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .card { background: #161b22; border-radius: 10px; overflow: hidden; cursor: pointer;
    transition: transform .2s, box-shadow .2s; }
  .card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(0,0,0,.6); }
  .card img { width: 100%; height: 270px; object-fit: cover; }
  .card-info { padding: 12px; }
  .card-info h3 { font-size: .95rem; margin-bottom: 6px; }
  .card-info span { color: #ffb800; font-size: .85rem; }
  .card-info p { color: #888; font-size: .8rem; margin-top: 4px; }
  .empty { padding: 80px 5%; text-align: center; color: #555; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8);
    z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: #161b22; border-radius: 12px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal video, .modal iframe { width: 100%; height: 400px; border: none; display: block; background: #000; }
  .modal-body { padding: 20px; }
  .modal-body h2 { margin-bottom: 8px; }
  .modal-body .meta { color: #ffb800; margin-bottom: 12px; }
  .modal-body p { color: #ccc; line-height: 1.6; margin-bottom: 16px; }
  .close-x { float: right; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

  /* Panels */
  .panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100;
    align-items: center; justify-content: center; }
  .panel.open { display: flex; }
  .panel-box { background: #161b22; padding: 30px; border-radius: 12px; width: 90%; max-width: 480px;
    max-height: 90vh; overflow-y: auto; }
  .panel-box h2 { margin-bottom: 16px; }
  .panel-box input, .panel-box textarea { width: 100%; padding: 10px; margin-bottom: 12px;
    background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; }
  .file-label { display: block; margin-bottom: 6px; color: #aaa; font-size: .85rem; }
  .poster-preview { max-width: 100px; display: none; margin-bottom: 12px; border-radius: 6px; }

  footer { text-align: center; padding: 30px; color: #555; border-top: 1px solid #21262d; }

  @media (max-width: 600px) {
    .hero h1 { font-size: 2rem; }
    .modal video, .modal iframe { height: 220px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Ivo <span>Vault</span></div>
  <div class="nav-right">
    <input type="text" id="search" placeholder="Search movies...">
    <span id="userEmail"></span>
    <!-- Admin-only buttons: hidden by default -->
    <button id="uploadBtn" class="nav-btn" style="display:none" onclick="openUpload()">+ Upload</button>
    <button id="editSiteBtn" class="nav-btn" style="display:none" onclick="openEditSite()">✏ Edit Website</button>
    <button id="signInBtn" class="nav-btn" onclick="googleSignIn()">Sign in with Google</button>
    <button id="logoutBtn" class="nav-btn" style="display:none" onclick="logout()">Sign out</button>
  </div>
</nav>

<section class="hero" id="hero">
  <div>
    <h1 id="heroTitle">Ivo Vault</h1>
    <p id="heroDesc">Your movie collection starts here. Sign in to watch movies.</p>
    <button class="btn" id="heroBtn" style="display:none" onclick="openMovie(heroMovie)">▶ Watch Now</button>
  </div>
</section>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="emptyMsg" style="display:none">
  <h2>No movies yet</h2><p>Check back soon!</p>
</div>

<!-- Movie modal -->
<div class="modal-bg" id="movieModal" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div id="playerBox"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Upload/edit panel -->
<div class="panel" id="uploadPanel" onclick="if(event.target===this) closeUpload()">
  <div class="panel-box">
    <h2 id="upTitle">Upload Movie</h2>
    <input type="hidden" id="editIdx" value="">
    <input type="text" id="mTitle" placeholder="Movie title">
    <input type="text" id="mYear" placeholder="Year (e.g. 2024)">
    <input type="text" id="mGenre" placeholder="Genre (e.g. Action)">
    <input type="text" id="mRating" placeholder="Rating (e.g. 8.5)">
    <textarea id="mDesc" rows="3" placeholder="Description"></textarea>

    <label class="file-label">Poster image (from your computer):</label>
    <input type="file" id="mPosterFile" accept="image/*" onchange="previewPoster(this)">
    <input type="text" id="mPosterURL" placeholder="...or poster image URL">
    <img id="posterPreview" class="poster-preview" alt="Poster preview">

    <label class="file-label">Movie video file (from your computer):</label>
    <input type="file" id="mVideoFile" accept="video/*">
    <input type="text" id="mTrailer" placeholder="...or YouTube embed URL (https://www.youtube.com/embed/...)">

    <button class="btn" style="width:100%; margin-top:10px" onclick="saveMovie()">Save Movie</button>
  </div>
</div>

<!-- Edit website panel -->
<div class="panel" id="sitePanel" onclick="if(event.target===this) closeEditSite()">
  <div class="panel-box">
    <h2>Edit Website</h2>
    <input type="text" id="sTitle" placeholder="Hero title">
    <input type="text" id="sDesc" placeholder="Hero description">
    <input type="text" id="sBg" placeholder="Hero background image URL">
    <button class="btn" style="width:100%" onclick="saveSite()">Save Website</button>
  </div>
</div>

<footer>© 2026 Ivo Vault. All rights reserved.</footer>

<script>
const ADMIN_EMAIL = "mugaruraivanew@gmail.com";
let isAdmin = false;
let currentUser = null; // any signed-in Gmail user

let movies = [];   // no default movies
let heroMovie = null;

function loadAll() {
  const m = localStorage.getItem("ivovault_movies");
  if (m) movies = JSON.parse(m);
  const s = localStorage.getItem("ivovault_site");
  if (s) applySite(JSON.parse(s), false);
}
function saveMovies() { localStorage.setItem("ivovault_movies", JSON.stringify(movies)); }

// ===== SIGN IN =====
// Any valid Gmail address signs in as a regular user.
// Only ADMIN_EMAIL becomes admin.
function googleSignIn() {
  const email = prompt("Sign in with your Google account.\nEnter your Gmail address:");
  if (!email) return;
  email = email.trim().toLowerCase();

  // Basic Gmail validation: must end with @gmail.com and have a username
  if (!/^[a-z0-9._%+-]+@gmail\.com$/.test(email)) {
    alert("Please enter a valid Gmail address (e.g. name@gmail.com).");
    return;
  }

  currentUser = email;
  localStorage.setItem("ivovault_user", email);
  if (email === ADMIN_EMAIL) {
    isAdmin = true;
    localStorage.setItem("ivovault_admin", email);
    alert("Welcome, Admin! You can upload movies and edit the website.");
  } else {
    isAdmin = false;
    localStorage.removeItem("ivovault_admin");
    alert("Welcome, " + email + "! You can now watch movies.");
  }
  applyAuthUI();
}
function logout() {
  currentUser = null;
  isAdmin = false;
  localStorage.removeItem("ivovault_user");
  localStorage.removeItem("ivovault_admin");
  applyAuthUI();
}
function applyAuthUI() {
  document.getElementById("signInBtn").style.display = currentUser ? "none" : "inline-block";
  document.getElementById("logoutBtn").style.display = currentUser ? "inline-block" : "none";
  document.getElementById("userEmail").textContent = currentUser ? currentUser : "";
  // Admin-only buttons hidden unless admin
  document.getElementById("uploadBtn").style.display = isAdmin ? "inline-block" : "none";
  document.getElementById("editSiteBtn").style.display = isAdmin ? "inline-block" : "none";
  render();
}
// Restore session on reload
if (localStorage.getItem("ivovault_user")) currentUser = localStorage.getItem("ivovault_user");
if (localStorage.getItem("ivovault_admin") === ADMIN_EMAIL) isAdmin = true;

// ===== MOVIE MODAL (plays uploaded video OR YouTube) =====
function openMovie(m) {
  const box = document.getElementById("playerBox");
  if (m.videoURL) {
    box.innerHTML = `<video src="${m.videoURL}" controls autoplay></video>`;
  } else if (m.trailer) {
    box.innerHTML = `<iframe src="${m.trailer}" title="Trailer" allowfullscreen></iframe>`;
  } else {
    box.innerHTML = "";
  }
  document.getElementById("modalBody").innerHTML = `
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>${m.title}</h2>
    <div class="meta">★ ${m.rating} &nbsp;•&nbsp; ${m.genre} &nbsp;•&nbsp; ${m.year}</div>
    <p>${m.desc || "No description available."}</p>
    ${isAdmin ? `<button class="btn" onclick="editMovie(movies.indexOf(currentModalMovie))">✏ Edit</button>
                 <button class="btn" style="background:#30363d" onclick="deleteMovie(currentModalMovie.title)">🗑 Delete</button>` : ""}
  `;
  window.currentModalMovie = m;
  document.getElementById("movieModal").classList.add("open");
}
function closeModal() {
  document.getElementById("movieModal").classList.remove("open");
  document.getElementById("playerBox").innerHTML = ""; // stops playback
}

// ===== POSTER PREVIEW =====
let posterData = null; // poster as base64 data URL (saves in localStorage)
function previewPoster(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    posterData = e.target.result;
    const pv = document.getElementById("posterPreview");
    pv.src = posterData;
    pv.style.display = "block";
  };
  reader.readAsDataURL(file);
}

// ===== UPLOAD / EDIT / DELETE =====
let videoObjectURL = null; // video from computer (current session)
function openUpload() {
  if (!isAdmin) return;
  document.getElementById("upTitle").textContent = "Upload Movie";
  document.getElementById("editIdx").value = "";
  ["mTitle","mYear","mGenre","mRating","mPosterURL","mTrailer","mDesc"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("mPosterFile").value = "";
  document.getElementById("mVideoFile").value = "";
  posterData = null;
  videoObjectURL = null;
  document.getElementById("posterPreview").style.display = "none";
  document.getElementById("uploadPanel").classList.add("open");
}
function editMovie(i) {
  if (!isAdmin || i < 0) return;
  const m = movies[i];
  document.getElementById("upTitle").textContent = "Edit Movie";
  document.getElementById("editIdx").value = i;
  mTitle.value = m.title; mYear.value = m.year; mGenre.value = m.genre;
  mRating.value = m.rating; mTrailer.value = m.trailer || ""; mDesc.value = m.desc || "";
  mPosterURL.value = m.img.startsWith("data:") ? "" : m.img;
  posterData = m.img.startsWith("data:") ? m.img : null;
  videoObjectURL = m.videoURL || null;
  const pv = document.getElementById("posterPreview");
  pv.src = m.img; pv.style.display = "block";
  closeModal();
  document.getElementById("uploadPanel").classList.add("open");
}
function saveMovie() {
  // If a video file was picked, create a session URL for it
  const videoFile = document.getElementById("mVideoFile").files[0];
  if (videoFile) videoObjectURL = URL.createObjectURL(videoFile);

  const m = {
    title: mTitle.value.trim() || "Untitled",
    year: mYear.value || "N/A",
    genre: mGenre.value || "Other",
    rating: mRating.value || "?",
    img: posterData || mPosterURL.value.trim() || "https://via.placeholder.com/300x450?text=No+Poster",
    trailer: mTrailer.value.trim(),
    videoURL: videoObjectURL || "",
    desc: mDesc.value.trim()
  };
  const idx = document.getElementById("editIdx").value;
  if (idx === "") {
    movies.push(m);
    if (!heroMovie) heroMovie = m; // first upload becomes featured
  } else {
    movies[parseInt(idx)] = m;
  }
  saveMovies(); closeUpload(); render();
}
function deleteMovie(title) {
  if (!confirm("Delete '" + title + "'?")) return;
  movies = movies.filter(m => m.title !== title);
  if (heroMovie && heroMovie.title === title) heroMovie = movies[0] || null;
  saveMovies(); closeModal(); render();
}
function closeUpload() { document.getElementById("uploadPanel").classList.remove("open"); }

// ===== EDIT WEBSITE =====
function openEditSite() {
  if (!isAdmin) return;
  sTitle.value = document.getElementById("heroTitle").textContent;
  sDesc.value = document.getElementById("heroDesc").textContent;
  sBg.value = localStorage.getItem("ivovault_heroBg") || "";
  document.getElementById("sitePanel").classList.add("open");
}
function applySite(s, persist = true) {
  document.getElementById("heroTitle").textContent = s.title;
  document.getElementById("heroDesc").textContent = s.desc;
  if (s.bg) {
    document.getElementById("hero").style.setProperty("--hero-bg", `url('${s.bg}')`);
    if (persist) localStorage.setItem("ivovault_heroBg", s.bg);
  }
}
function saveSite() {
  applySite({ title: sTitle.value, desc: sDesc.value, bg: sBg.value.trim() });
  closeEditSite();
}
function closeEditSite() { document.getElementById("sitePanel").classList.remove("open"); }

// ===== RENDER =====
let activeGenre = "All";
const filtersEl = document.getElementById("filters");
const gridEl = document.getElementById("grid");
const searchEl = document.getElementById("search");

function buildFilters() {
  filtersEl.innerHTML = "";
  const gs = [...new Set(movies.map(m => m.genre))];
  if (gs.length === 0) { filtersEl.classList.remove("show"); return; }
  filtersEl.classList.add("show");
  ["All", ...gs].forEach(g => {
    const b = document.createElement("button");
    b.textContent = g;
    if (g === activeGenre) b.classList.add("active");
    b.onclick = () => { activeGenre = g; buildFilters(); render(); };
    filtersEl.appendChild(b);
  });
}

function render() {
  if (movies.length === 0) {
    gridEl.innerHTML = "";
    document.getElementById("emptyMsg").style.display = "block";
    buildFilters();
    return;
  }
  document.getElementById("emptyMsg").style.display = "none";
  buildFilters();
  const q = searchEl.value.toLowerCase();
  const list = movies.filter(m =>
    (activeGenre === "All" || m.genre === activeGenre) &&
    m.title.toLowerCase().includes(q)
  );
  gridEl.innerHTML = list.map((m) => {
    const idx = movies.indexOf(m);
    return `<div class="card" onclick="openMovie(movies[${idx}])">
      <img src="${m.img}" alt="${m.title}" loading="lazy">
      <div class="card-info">
        <h3>${m.title}</h3>
        <span>★ ${m.rating}</span>
        <p>${m.genre} • ${m.year}</p>
      </div>
    </div>`;
  }).join("") || "<p>No movies found.</p>";
}

searchEl.addEventListener("input", render);
loadAll(); applyAuthUI(); render();
</script>
</body>
</html>
